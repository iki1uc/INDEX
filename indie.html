<div class="section">
<h2>RESPO – Karo Status</h2>
<div id="respoKaro"></div>
</div>

<script type="module">
import AUTO from "./sys/AUTO.sys";

document.getElementById("respoKaro").innerHTML =
  AUTO.RESPO.map(r =>
    `<div class="karo" style="background:${r.color}" 
      title="${r.state} vec:${JSON.stringify(r.vec)}"></div>`
  ).join("");
</script>

<style>
.karo {
  width: 16px;
  height: 16px;
  display: inline-block;
  margin: 3px;
}
</style>
