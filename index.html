<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>INDEX – AUTO DOMINANT SYSTEM 360°</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; }
h1 { color:#6cf; letter-spacing:4px; }
h2 { color:#0f0; margin-top:30px; }
pre { border:1px solid #0f0; padding:10px; background:#111; }
.section { margin-bottom:40px; }
</style>

<script type="module">

import { RUN360 } from "./core/RUN360.js";
import { RUN9 } from "./core/RUN9.js";
import { RUN12 } from "./core/RUN12.js";
import { RUN128 } from "./core/RUN128.js";
import { ECO } from "./core/ECO.js";
import { IDENTITY } from "./core/BETA.js";
import { ANIME_STYLE } from "./core/BETA.js";

import MASTER from "./sys/master.sys";
import SLAVE from "./sys/SLAVE.sys";
import AUTO from "./sys/AUTO.sys";

/* ============================================================
   AUTO – DOMINANT SYSTEM
============================================================ */

document.getElementById("autoSystem").innerText =
  JSON.stringify(AUTO, null, 2);

/* ============================================================
   FULL SYSTEM
============================================================ */

const full = await RUN360();

/* ============================================================
   RUN 9 – Portal Map
============================================================ */

document.getElementById("portalMap").innerText =
  RUN9(full.index).slice(0,60).map(p =>
    `${p.id} | Portal ${p.portal} | Warp ${p.warp} | Jump ${p.jump}`
  ).join("\n");

/* ============================================================
   RUN 12 – Hyperraum Cluster
============================================================ */

document.getElementById("clusterTree").innerText =
  Object.entries(RUN12(full.index)).map(([k,v]) =>
    `Gamma Cluster ${k} → ${v.length} Elemente`
  ).join("\n");

/* ============================================================
   VEC128 – Anime Flow
============================================================ */

document.getElementById("vec128").innerText =
  RUN128(full.index).map(v =>
    `${v.id} | Flow ${v.vec128.flow.toFixed(3)} | Style ${ANIME_STYLE(v)}`
  ).join("\n");

/* ============================================================
   ECO – Ökosystem Balance
============================================================ */

document.getElementById("ecoBar").innerText =
  full.index.slice(0,50).map(cell => {
    const eco = ECO(cell);
    const bar = "■".repeat(Math.floor(eco*50)) + "□".repeat(50-Math.floor(eco*50));
    return `${cell.id} | ${bar} ${eco}`;
  }).join("\n");

/* ============================================================
   IDENTITY MATRIX
============================================================ */

document.getElementById("identityMatrix").innerText =
  full.index.slice(0,50).map(cell => {
    const id = IDENTITY(cell);
    return `${cell.id} | arc:${id.arc} | role:${id.role} | mood:${id.mood}`;
  }).join("\n");

</script>
</head>

<body>

<h1>INDEX – AUTO DOMINANT SYSTEM 360°</h1>

<div class="section">
<h2>AUTO SYSTEM – Dominant</h2>
<pre id="autoSystem"></pre>
</div>

<div class="section">
<h2>RUN 9 – Portal Map</h2>
<pre id="portalMap"></pre>
</div>

<div class="section">
<h2>RUN 12 – Hyperraum Cluster</h2>
<pre id="clusterTree"></pre>
</div>

<div class="section">
<h2>VEC128 – Anime Flow</h2>
<pre id="vec128"></pre>
</div>

<div class="section">
<h2>ECO – Ökosystem Balance</h2>
<pre id="ecoBar"></pre>
</div>

<div class="section">
<h2>Identity Matrix – Charakter</h2>
<pre id="identityMatrix"></pre>
</div>

</body>
</html>
