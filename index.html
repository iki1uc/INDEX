<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RESPO – SHOW A LA CARTE + 360° Dashboard</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; }

/* Status-Karo */
#statusKaro {
    width: 20px;
    height: 20px;
    border: 2px solid #0f0;
    background: #300;
    display: inline-block;
    margin-bottom: 10px;
}

/* Move Animation */
#move_anim .cube {
    width:80px; height:80px;
    position:relative;
    transform-style:preserve-3d;
    animation:spin 3s infinite linear;
}
.face {
    position:absolute; width:80px; height:80px;
    background:#0f0; color:#000;
    display:flex; align-items:center; justify-content:center;
    font-size:30px;
}
@keyframes spin {
    from{transform:rotateY(0deg);}
    to{transform:rotateY(360deg);}
}

/* 9×9 Raum */
.roomCell {
    position:absolute;
    width:30px; height:30px;
    background:#111;
    border:1px solid #0f0;
    text-align:center;
    line-height:30px;
}

/* Zoom */
.zoomCell {
    position:absolute;
    background:#222;
    color:#0f0;
    padding:5px;
    border:1px solid #0f0;
}
</style>

<!-- Module laden -->
<script type="module" src="./core/RESPO_LIST.js"></script>
<script type="module" src="./core/INDEX_RESPO.js"></script>
<script type="module" src="./core/INDEX.respo.js"></script>
<script type="module" src="./core/MEGA_INDEX.js"></script>
<script type="module" src="./core/INDEX.portal.js"></script>
<script type="module" src="./core/MEGA_INDEX.zoom.js"></script>
<script type="module" src="./core/12ALL.master.js"></script>
<script type="module" src="./core/INDEX.hyperraum.js"></script>

<script type="module">

/* Status-Karo Logik */
function updateStatus(respoCount){
    const box = document.getElementById("statusKaro");
    const txt = document.getElementById("statusText");

    if(respoCount === 410){
        box.style.background = "#0f0"; // Grün
        txt.innerText = "ONLINE – 410 RESPO geladen";
    }
    else if(respoCount > 0){
        box.style.background = "#ff0"; // Gelb
        txt.innerText = "WARNUNG – nur " + respoCount + " RESPO geladen";
    }
    else {
        box.style.background = "#f00"; // Rot
        txt.innerText = "OFFLINE – keine RESPO geladen";
    }
}

/* RESPO 410 + TMP + 360° Axe laden */
import { RESPO_INDEX } from "./core/INDEX.respo.js";

await RESPO_INDEX.init();

/* Status */
updateStatus(RESPO_INDEX.ALL.length);

/* RESPO 410 */
document.getElementById("respo410").innerText =
    JSON.stringify(RESPO_INDEX.ALL, null, 2);

/* TMP Status */
document.getElementById("tmpStatus").innerText =
    JSON.stringify(RESPO_INDEX.ALL.slice(0,20), null, 2);

/* 360° Axe */
document.getElementById("axe360").innerText =
    JSON.stringify(RESPO_INDEX.ALL.map(x => x.axe).slice(0,20), null, 2);

/* Hyperraum starten */
const hyper = INDEX_HYPERRAUM.start();

document.getElementById("base").innerText =
    JSON.stringify(hyper.base.slice(0,20), null, 2);

document.getElementById("portal").innerText =
    JSON.stringify(hyper.portal.slice(0,20), null, 2);

document.getElementById("zoom").innerText =
    JSON.stringify(hyper.zoom.slice(0,5), null, 2);

document.getElementById("best").innerText =
    JSON.stringify(hyper.best, null, 2);

</script>

</head>
<body>

<h1>RESPO – 360° Dashboard</h1>

<div id="statusKaro"></div>
<pre id="statusText"></pre>

<h2>RESPO 410</h2>
<pre id="respo410"></pre>

<h2>TMP Status</h2>
<pre id="tmpStatus"></pre>

<h2>360° Axe</h2>
<pre id="axe360"></pre>

<hr>

<h1>RESPO – SHOW A LA CARTE</h1>

<h2>Move Animation</h2>
<div id="move_anim"></div>

<h2>Move History</h2>
<pre id="move_history"></pre>

<h2>Hyperraum Base (20)</h2>
<pre id="base"></pre>

<h2>Portal Layer (20)</h2>
<pre id="portal"></pre>

<h2>Zoom Layer (5)</h2>
<pre id="zoom"></pre>

<h2>Best Move</h2>
<pre id="best"></pre>

<h2>Raum 9×9</h2>
<div id="room9x9" style="position:relative; width:270px; height:270px;"></div>

</body>
</html>
