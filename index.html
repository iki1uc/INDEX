<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RESPO – Master Index</title>

    <style>
        body { font-family: monospace; background:#111; color:#0f0; padding:20px; }
        pre { background:#000; padding:20px; border:1px solid #0f0; }
        h1, h2 { color:#0f0; }
    </style>

    <script type="module">
        import { RESPO_INDEX } from "./core/INDEX.respo.js";

        // 1. Ausgabe aller Systeme
        document.addEventListener("DOMContentLoaded", () => {

            document.getElementById("all").innerText =
                JSON.stringify(RESPO_INDEX.ALL, null, 2);

            document.getElementById("org").innerText =
                JSON.stringify(RESPO_INDEX.ORG, null, 2);

            document.getElementById("lol").innerText =
                JSON.stringify(RESPO_INDEX.LOL, null, 2);

            document.getElementById("pipe").innerText =
                JSON.stringify(RESPO_INDEX.PIPE, null, 2);
        });
    </script>
</head>

<body>
    <h1>RESPO – Master Index</h1>

    <h2>RESPO ALL</h2>
    <pre id="all"></pre>

    <h2>RESPO ORG</h2>
    <pre id="org"></pre>

    <h2>RESPO LOL (Debug)</h2>
    <pre id="lol"></pre>

    <h2>RESPO Pipeline</h2>
    <pre id="pipe"></pre>
</body>
</html>
